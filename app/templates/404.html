{% extends "base.html" %}

{% block title %}404 Page Not Found{% endblock %}

{% block content %}
<div class="row justify-content-center text-center py-5">
    <div class="col-12 col-md-8 col-lg-6">
        <div class="card shadow-sm p-4">
            <div class="card-body">
                <i class="bi bi-compass text-warning" style="font-size: 4rem;"></i>
                <h2 class="fw-bold text-dark mt-3">404 - Page Not Found</h2>
                <p class="text-secondary mt-2">
                    The URL you requested does not exist on this placement prediction portal.
                </p>
                <div class="mt-4">
                    <a href="{{ url_for('index') }}" class="btn btn-primary px-4">
                        <i class="bi bi-house-door-fill me-1"></i> Return Home
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
