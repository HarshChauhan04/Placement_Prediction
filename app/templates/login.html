{% extends "base.html" %}

{% block title %}Account Sign In{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-12 col-md-8 col-lg-5">
        <div class="card-novara">
            <div class="card-novara-header-dark text-center py-4">
                <div class="brand-icon-box mx-auto mb-2">
                    <i class="bi bi-shield-lock-fill fs-5"></i>
                </div>
                <h4 class="mb-1 fw-bold">Sign In to PlacementAI</h4>
                <p class="text-white-50 small mb-0">Access your assessment history and analytical dashboard</p>
            </div>
            <div class="card-novara-body p-4">
                <form method="POST" action="{{ url_for('auth.login') }}" novalidate>
                    <!-- CSRF Protection Token -->
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <!-- Email Address -->
                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" id="email" name="email"
                                   placeholder="name@college.edu" value="{{ email|default('') }}" required autofocus>
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-key"></i></span>
                            <input type="password" class="form-control" id="password" name="password"
                                   placeholder="Enter account password" required>
                        </div>
                        <div class="form-text small text-muted mt-2 d-flex align-items-center gap-1">
                            <i class="bi bi-shield-check text-primary"></i>
                            <span>Accounts automatically lock for 15 minutes after 5 failed attempts.</span>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn-pill-primary justify-content-center py-2 shadow">
                            <span>Sign In</span>
                            <i class="bi bi-arrow-right"></i>
                        </button>
                    </div>
                </form>
            </div>
            <div class="card-footer bg-light text-center py-3 border-top">
                <span class="text-muted small">New student?</span>
                <a href="{{ url_for('auth.register') }}" class="fw-bold ms-1 text-primary">Create an account</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
